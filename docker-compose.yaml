services:
  httpd_service:
    image: 'httpd'
    networks:
      - 'Network-A'
    ports:
      - '80:80'
    volumes:
      - '/mnt/Slave:/usr/local/apache2/htdocs'
  
  tomcat_service:
    image: 'tomcat:9'
    networks:
      - 'Network-B'
    ports:
      - '8080:8080'
    volumes:
      - '/mnt/tomcat:/usr/local/tomcat/webapps/'
    command: 'sh -c ./Access.sh'
    command: 'sh -c aws s3 cp s3://vel-bucket-manish15022026/2026Q1/index.html .' 

networks:
  Network-A:
  Network-B:
