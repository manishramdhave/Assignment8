services:
  httpd_service:
    image: 'httpd'
    networks:
      - 'Network-A'
    ports:
      - '80:80'
    volumes:
      - '/mnt/Slave:/usr/local/apache2/htdocs'
  tomcat_service:
    image: 'tomcat'
    networks:
      - 'Network-B'
    ports:
      - '8080:8080'
    volumes:
      - '/mnt/Slave:/usr/local/tomcat/webapps/car-showroom-1.0'

networks:
  Network-A:
  Network-B:
